[package]
name = "schwarzschild"
version = "0.1.0"
edition = "2024"

[dependencies]
wgpu = "29.0"
winit = "0.30"
pollster = "0.4"
env_logger = "0.11"
log = "0.4"
glam = "0.32"
bytemuck = { version = "1.25", features = ["derive"] }

[lib]
name = "schwarzschild"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "schwarzschild"
path = "src/main.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.122"
wasm-bindgen-futures = "0.4.72"
web-sys = { version = "0.3.99", features = [
    "Document",
    "Window",
    "Element",
    "HtmlCanvasElement",
    "CssStyleDeclaration"
] }
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"